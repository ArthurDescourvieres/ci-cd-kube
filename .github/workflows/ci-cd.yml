name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: CI · tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  build:
      name: CI · image Docker
      needs: test
      if: github.event_name == 'push'
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        packages: write
      env:
        IMAGE: ghcr.io/arthurdescourvieres/ci-cd-kube
      steps:
        - uses: actions/checkout@v7

        - uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Build et push (branche main)
          if: github.ref == 'refs/heads/main'
          run: |
            docker build --target dev -t $IMAGE:dev -t $IMAGE:sha-${GITHUB_SHA:0:7} .
            docker push $IMAGE:dev
            docker push $IMAGE:sha-${GITHUB_SHA:0:7}

        - name: Build et push (tag de version)
          if: startsWith(github.ref, 'refs/tags/v')
          run: |
            VERSION=${GITHUB_REF#refs/tags/v}
            docker build --target prod -t $IMAGE:$VERSION -t $IMAGE:latest .
            docker push $IMAGE:$VERSION
            docker push $IMAGE:latest