name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]

jobs:
  test:
    name: CI tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test

  integration:
    name: CI integration tests
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: notes
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: notes
        options: >-
          --health-cmd "pg_isready -U notes -d notes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://notes:notes@localhost:5432/notes
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: CI end-to-end tests
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: docker compose up -d --build --wait
      - run: npx playwright test --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-trace-${{ matrix.browser }}
          path: test-results/


  build:
    name: CI Docker image
    needs: [test, integration]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.main.outputs.image || steps.tag.outputs.image }}
    env:
      IMAGE: ghcr.io/arthurdescourvieres/ci-cd-kube
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (main branch)
        id: main
        if: github.ref == 'refs/heads/main'
        run: |
          docker build --target dev -t $IMAGE:dev -t $IMAGE:sha-${GITHUB_SHA:0:7} .
          docker push $IMAGE:dev
          docker push $IMAGE:sha-${GITHUB_SHA:0:7}
          echo "image=$IMAGE:sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push (version tag)
        id: tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          docker build --target prod -t $IMAGE:$VERSION -t $IMAGE:latest .
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest
          echo "image=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"

  scan:
    name: CI image scan
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image }}
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'


  notify:
    name: CI Google Chat notification
    needs: [test, integration, e2e, build, scan, deploy]
    runs-on: ubuntu-24.04
    if: always() && github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Find the pull request behind this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq 'if length == 0 then null
                  else {number: .[0].number, title: .[0].title, url: .[0].html_url}
                  end' > pr.json

      - name: Send Google Chat notification
        env:
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          NEEDS: ${{ toJSON(needs) }} 
        #   *CI/CD SUCCESS* — ci-cd-kube
        #   commit ce5c88c by ArthurDescourvieres
        #   PR #82 — the pull request title     (or "pushed directly to main")
        #   failed: test (failure)              (line absent when everything is green)
        #   <run url|open the run>
        run: |
          jq -n \
          --argjson needs "$NEEDS" \
          --arg sha "${GITHUB_SHA:0:7}" \
          --arg author "$GITHUB_ACTOR" \
          --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --slurpfile pr pr.json \
            '($needs | to_entries
            | map(select(.value.result != "success"
                     and .value.result != "skipped"))) as $ko
           | { text: (
               "*CI/CD \(if $ko == [] then "SUCCESS" else "FAILURE" end)* — ci-cd-kube\n"
             + "commit \($sha) by \($author)\n"
             + (if $pr[0] == null
                then "pushed directly to main\n"
                else "PR #\($pr[0].number) — \($pr[0].title)\n" end)
             + (if $ko == [] then ""
                else "failed: "
                   + ($ko | map("\(.key) (\(.value.result))") | join(", ")) + "\n" end)
             + "<\($run_url)|open the run>"
             ) }' > payload.json
          curl -sS --fail-with-body -X POST "$WEBHOOK" \
          -H 'Content-Type: application/json' \
          -d @payload.json

  deploy:
    name: CD Kubernetes
    needs: [scan, e2e]    
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Write the kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
        # read and write

      - name: Deploy the new image
        env:
          IMAGE: ghcr.io/arthurdescourvieres/ci-cd-kube
        run: |
          kubectl set image deployment/ci-cd-kube \
            app=$IMAGE:sha-${GITHUB_SHA:0:7} \
            -n ci-cd-kube

      - name: Wait for the rollout
        run: |
          kubectl rollout status deployment/ci-cd-kube \
            -n ci-cd-kube \
            --timeout=120s
