name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: CI · tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  build:
    name: CI · Docker image
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/arthurdescourvieres/ci-cd-kube
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          docker build --target dev -t $IMAGE:dev -t $IMAGE:sha-${GITHUB_SHA:0:7} .
          docker push $IMAGE:dev
          docker push $IMAGE:sha-${GITHUB_SHA:0:7}

      - name: Build and push (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          docker build --target prod -t $IMAGE:$VERSION -t $IMAGE:latest .
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest

  notify:
    name: CI · Google Chat notification
    needs: [test, build]
    runs-on: ubuntu-24.04
    if: always() && github.event_name == 'push'
    permissions:
      contents: read
    steps: 

      - name: Send Google Chat notification 
        env: 
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          STATUS: ${{ contains(needs.*.result, 'failure') && 'FAILURE' || 'SUCCESS' }}
          AUTHOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository}}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="*CI/CD $STATUS* - ci-cd-kube\ncommit ${GITHUB_SHA:0:7} by $AUTHOR\n<$RUN_URL|open the run>"
          curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"$MESSAGE\"}"
        # The message will be : CI/CD SUCCESS - ci-cd-kube commit cc1a23c by ArthurDescourvieres open the run