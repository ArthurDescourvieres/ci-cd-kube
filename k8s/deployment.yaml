apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-kube
  namespace: ci-cd-kube
  labels:
    app: ci-cd-kube
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ci-cd-kube
  template:
    metadata:
      labels:
        app: ci-cd-kube
    spec:
      containers:
        - name: app
          image: ghcr.io/arthurdescourvieres/ci-cd-kube:sha-57aaf29
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
